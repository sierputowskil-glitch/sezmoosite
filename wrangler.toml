# Cloudflare Pages — local `wrangler pages dev` + dashboard deploy
name = "sezmoo"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

# Secrets (dashboard / `wrangler pages secret put` / `.dev.vars`):
#   TURNSTILE_SECRET_KEY
#   SMTP_PASS
#
# Optional vars (can also live in dashboard):
#   SMTP_HOST=smtp.cyberfolks.pl
#   SMTP_PORT=587
#   SMTP_USER=no-reply@sezmoo.com
#   SMTP_FROM=no-reply@sezmoo.com
#   SMTP_FROM_NAME=SEZMOO
#   MAIL_TO=biuro@sezmoo.com

[vars]
SMTP_HOST = "smtp.cyberfolks.pl"
SMTP_PORT = "587"
SMTP_USER = "no-reply@sezmoo.com"
SMTP_FROM = "no-reply@sezmoo.com"
SMTP_FROM_NAME = "SEZMOO"
MAIL_TO = "biuro@sezmoo.com"

# Contact form rate limit (shared across isolates).
# Create namespace, then replace 209eaca54aa048f5929e9c40271ef6b6:
#   wrangler kv namespace create CONTACT_RATE_LIMIT
#   wrangler kv namespace create CONTACT_RATE_LIMIT --preview
# Bind the same names in Cloudflare Pages → Settings → Bindings if dashboard deploy.
[[kv_namespaces]]
binding = "CONTACT_RATE_LIMIT"
id = "209eaca54aa048f5929e9c40271ef6b6"
preview_id = "a068fd2af8f5415b8ad2b7785df8d461"
