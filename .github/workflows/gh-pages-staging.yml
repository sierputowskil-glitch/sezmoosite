name: Staging — GitHub Pages

on:
  push:
    branches: [feat/astro-migration, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Astro check
        run: npm run check
      - name: Build Astro (GH Pages base)
        env:
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # GH Pages has no Pages Functions — do not point forms at /api/contact
          PUBLIC_CONTACT_API_URL: ''
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build
      # Artifact only needed when this run will deploy (main). feat/* is build-check only —
      # github-pages env allows main only.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Environment protection: only main may deploy to github-pages.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
