name: Production — Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Astro check
        run: npm run check
      - name: Build Astro (prod root)
        env:
          PUBLIC_SITE_URL: https://sezmoo.com
          PUBLIC_BASE_PATH: /
          PUBLIC_CONTACT_API_URL: /api/contact
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_ENABLE_GTM: 'true'
          PUBLIC_GTM_ID: GTM-KJFG8DZL
        run: npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sezmoo
          # Functions dir is auto-detected next to wrangler.toml / as functions/
