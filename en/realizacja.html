          '<div class="cs-film__play"><span class="cs-film__btn" aria-hidden="true"></span></div>' +
          '<div class="cs-film__meta"><span class="rec">● REC</span><span>' + d.client.toUpperCase() + '</span><span>' + (d.short ? "9:16" : "16:9") + '</span></div>' +
          '<div class="cs-film__bar"><i></i></div>' +

    if (f.querySelector("iframe")) return;
    var ifr = document.createElement("iframe");
    ifr.src = "https://www.youtube-nocookie.com/embed/" + v + "?autoplay=1&rel=0&modestbranding=1&playsinline=1";
    ifr.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
    ifr.setAttribute("allowfullscreen", "");
    ifr.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5;";
    f.appendChild(ifr);
  }
  f.addEventListener("click", play);
  f.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(); } });
